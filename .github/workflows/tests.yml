name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tkinter and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Byte-compile
        run: python -m compileall -q BugBountyHunter.py script.py

      - name: Run tests under Xvfb
        run: xvfb-run -a python -m pytest test_BugBountyHunter.py -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip ruff
      - name: Ruff (errors only, non-blocking on style)
        run: ruff check --select E9,F63,F7,F82 BugBountyHunter.py script.py
