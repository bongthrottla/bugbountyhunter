# BugBountyHunter Pro - Configuration File
# This file contains default settings for the application

[scanning]
# Default scan timeout in seconds
timeout = 300

# Maximum concurrent scans
max_concurrent_scans = 3

# Default output format
output_format = json

[tools]
# Tool configuration paths (auto-detected if empty)
subfinder_path = 
httpx_path = 
nuclei_path = 
ffuf_path = 

[reporting]  
# Default report format
report_format = markdown

# Include screenshots in reports
include_screenshots = true

# Report template directory
template_dir = templates/

[database]
# SQLite database location
db_path = scans/bugbounty.db

# Enable automatic cleanup of old scans
auto_cleanup = false

# Keep scans for N days (if auto_cleanup enabled)
retention_days = 30

[ui]
# GUI theme (light/dark/system)
theme = system

# Window size (width x height)
window_size = 1000x800

# Font size for output area
output_font_size = 10
